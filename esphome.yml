esphome:
  name: tendair-table

esp32:
  # board: esp32-c3-devkitm-1
  board: esp32-c3-devkitc-02
  framework:
    type: esp-idf

# Enable logging
logger:
  hardware_uart: UART0
  deassert_rts_dtr: true
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: tEyh+lJ9TfAPAmaUy6+B1tB/PdmfFSfgksnShUcQ8IY=

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tendair-Table Fallback Hotspot"
    password: "2qKOhE6AxRcd"

captive_portal:

i2c:
  sda: GPIO08
  scl: GPIO04

sensor:
  - platform: sen5x
    id: sen66
    type: sen66
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      accuracy_decimals: 0
    voc:
      name: "VOC"
      algorithm_tuning:
        index_offset: 100
        learning_time_offset_hours: 12
        learning_time_gain_hours: 12
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    temperature_compensation:
      offset: 0
      normalized_offset_slope: 0
      time_constant: 0
    nox:
      name: "NOₓ"
      accuracy_decimals: 0
    co2:
      name: "CO₂"
      accuracy_decimals: 0
    update_interval: 10s

interval:
  - interval: 7d
    then:
      - sen5x.start_fan_autoclean: sen66
